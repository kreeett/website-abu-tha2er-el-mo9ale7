<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="100%" stop-color="#ffd6f0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="196" fill="url(#bg)" stroke="#e6d4ff" stroke-width="8"/>
  <circle cx="60" cy="90" r="10" fill="#d9ffe9"/>
  <circle cx="340" cy="110" r="14" fill="#d9ffe9"/>
  <circle cx="330" cy="320" r="9" fill="#e9dcff"/>
  <circle cx="70" cy="300" r="12" fill="#e9dcff"/>

  <!-- the 6 (up) and the 7 (down) -->
  <g font-family="Comic Sans MS, Comic Sans, cursive" font-weight="bold" text-anchor="middle"
     stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">
    <text x="120" y="150" font-size="140" fill="#ff9fe0" transform="rotate(-10 120 110)">6</text>
    <text x="285" y="190" font-size="140" fill="#9fd8ff" transform="rotate(10 285 150)">7</text>
  </g>

  <!-- left hand, palm up, raised -->
  <g transform="translate(118 238) rotate(-8)" stroke="#e0a982" stroke-width="4" stroke-linejoin="round" fill="#ffd9bd">
    <ellipse cx="0" cy="12" rx="62" ry="34"/>
    <ellipse cx="-48" cy="-14" rx="12" ry="26" transform="rotate(-25 -48 -14)"/>
    <ellipse cx="-22" cy="-22" rx="11" ry="27"/>
    <ellipse cx="2" cy="-24" rx="11" ry="28"/>
    <ellipse cx="26" cy="-20" rx="10" ry="25"/>
    <ellipse cx="58" cy="0" rx="10" ry="22" transform="rotate(50 58 0)"/>
    <ellipse cx="0" cy="62" rx="26" ry="32" fill="#ffd9bd"/>
  </g>

  <!-- right hand, palm up, lowered -->
  <g transform="translate(282 282) rotate(8)" stroke="#e0a982" stroke-width="4" stroke-linejoin="round" fill="#ffd9bd">
    <ellipse cx="0" cy="12" rx="62" ry="34"/>
    <ellipse cx="48" cy="-14" rx="12" ry="26" transform="rotate(25 48 -14)"/>
    <ellipse cx="22" cy="-22" rx="11" ry="27"/>
    <ellipse cx="-2" cy="-24" rx="11" ry="28"/>
    <ellipse cx="-26" cy="-20" rx="10" ry="25"/>
    <ellipse cx="-58" cy="0" rx="10" ry="22" transform="rotate(-50 -58 0)"/>
    <ellipse cx="0" cy="62" rx="26" ry="32" fill="#ffd9bd"/>
  </g>

  <!-- motion swooshes -->
  <g fill="none" stroke="#c9b6ff" stroke-width="5" stroke-linecap="round">
    <path d="M40 220 Q55 200 48 180"/>
    <path d="M360 250 Q345 270 352 290"/>
  </g>
</svg>
